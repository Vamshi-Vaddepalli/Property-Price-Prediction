name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (well under the 12-hour sleep threshold)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep it awake
        run: curl -sSf https://property-price-prediction-gurgaon.streamlit.app/ || echo "Ping failed, app may be waking up"
